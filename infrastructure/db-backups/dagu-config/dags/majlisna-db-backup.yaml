# Daily encrypted dump of majlisna-db (see docs/operations/backups.md).
#
# 03:45 UTC: 45 minutes before LaTabdhir's 04:30 job on the same SeaweedFS, and the quiet
# hour for Majlisna (05:45 in Riyadh, 04:45 in Paris in winter). The dump takes seconds.
#
# Dagu passes a step ONLY the variables listed here (not the container environment), and
# leaves "${NAME}" literally when NAME is not in secrets.env: so every name below must be
# in secrets.env, even empty (backup.sh treats a literal "${NAME}" as unset).
description: "Daily encrypted pg_dump of majlisna-db to SeaweedFS (newest 30 versions)"
schedule: "45 3 * * *"
# A scheduler that was down at 03:45 (host reboot) replays the missed run once on start.
catchup_window: "20h"
overlap_policy: skip
timeout_sec: 1800
hist_retention_days: 90
env:
  - PGHOST: ${PGHOST}
  - PGPORT: ${PGPORT}
  - PGUSER: ${PGUSER}
  - PGDATABASE: ${PGDATABASE}
  - PGPASSWORD: ${PGPASSWORD}
  - S3_ENDPOINT: ${S3_ENDPOINT}
  - S3_BUCKET: ${S3_BUCKET}
  - S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  - S3_SECRET_KEY: ${S3_SECRET_KEY}
  - RETENTION_VERSIONS: ${RETENTION_VERSIONS}
  - BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL}
  - DISCORD_WEBHOOK: ${DISCORD_WEBHOOK}
  - OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT}
  - OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET}
  - OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY}
  - OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY}
  - OFFSITE_S3_REGION: ${OFFSITE_S3_REGION}
  - OFFSITE_S3_ADDRESSING: ${OFFSITE_S3_ADDRESSING}
  - OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX}
  - OFFSITE_S3_STORAGE_CLASS: ${OFFSITE_S3_STORAGE_CLASS}
  - OFFSITE_RETENTION_VERSIONS: ${OFFSITE_RETENTION_VERSIONS}
  # Pinned here, not read from secrets.env: the scheduled job always encrypts to the
  # owner's key baked into the image, and always writes "majlisna-" objects.
  - BACKUP_RECIPIENT_FILE: /etc/majlisna/backup-public-key.asc
  - BACKUP_NAME_PREFIX: majlisna
steps:
  - name: backup
    run: /usr/local/bin/backup.sh
