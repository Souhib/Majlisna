# Alembic: the schema's migrations (PostgreSQL only). See backend/CLAUDE.md, "Migrations (Alembic)".
#
# The database URL is NOT here: migrations/env.py reads majlisna.settings.Settings
# (DIRECT_DATABASE_URL when set, else DATABASE_URL), like the app. The app itself runs
# these migrations at boot (majlisna/schema.py); the CLI is for writing and checking them:
#
#   DATABASE_URL=postgresql+asyncpg://user:pass@127.0.0.1:5432/db uv run alembic upgrade head
#   DATABASE_URL=... uv run alembic revision --autogenerate -m "add x to y"
#   DATABASE_URL=... uv run alembic check

[alembic]
script_location = %(here)s/migrations

# migrations/versions/20261101_0001_baseline_production_schema.py: the date first, so the
# directory lists the revisions in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# backend/ on sys.path, so env.py imports majlisna wherever alembic is run from.
prepend_sys_path = %(here)s
path_separator = os

timezone = UTC

[post_write_hooks]
# A generated revision comes out formatted and lint-fixed, as CI checks migrations/.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

# Logging for the CLI only: the app runs the migrations without reading this section
# (env.py skips fileConfig when the app hands it a connection), so it never touches the
# app's loggers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
