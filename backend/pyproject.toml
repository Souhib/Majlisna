[project]
name = "majlisna"
version = "0.1.0"
description = "Islamic Party Game - Real-time multiplayer platform for Islamicized party games"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Upper bound: the Dockerfile installs from pyproject (not uv.lock), and sqlmodel 0.0.47
    # rejects naive datetimes, which the disconnect checker and room writes still pass (28/09/2026).
    "sqlmodel>=0.0.22,<0.0.36",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "passlib>=1.7.4",
    "loguru>=0.7.2",
    "scalar-fastapi>=1.0.0",
    "httpx>=0.27.0",
    "pycountry>=23.12.11",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "uvloop>=0.21.0",
    "httptools>=0.6.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-socketio[asyncio]>=5.12.0",
    "redis[hiredis]>=5.0.0",
    "resend>=2.0.0",
    "jinja2>=3.1.0",
    "logfire[fastapi]>=3.0.0",
    # Runtime dependency, not a test-only one: scripts/generate_fake_data.py is the
    # project's schema-migration mechanism (there is no Alembic — a model change is
    # applied by dropping and reseeding), and it must therefore run on the
    # production image. As a dev extra it was absent there, so --create-db died with
    # ModuleNotFoundError right after --delete had already emptied the database.
    "faker>=40.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "freezegun>=1.4.0",
    "testcontainers>=4.8.0",
    "ruff>=0.7.0",
    # Exact pin, not a floor. ty is pre-1.0 and its diagnostics change between
    # releases: a range would let a fresh CI checkout resolve a version that
    # reports errors the developer's lockfile never showed. Upgrading is a
    # deliberate act — bump this, run `uv run poe typecheck`, adjust suppressions.
    "ty==0.0.63",
    # Stub packages. ty consumes the same `.pyi` distributions mypy did, so these
    # are not mypy leftovers: they are what gives the auth path (passlib, jose)
    # real types instead of Unknown.
    "types-passlib>=1.7.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["majlisna"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "N", "PL", "ARG"]
ignore = ["E501", "PLR0913", "PLR2004", "ARG002", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["majlisna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=majlisna --cov-report=term --cov-fail-under=50"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "majlisna/app.py",
    "majlisna/dependencies.py",
    "majlisna/database.py",
    "majlisna/logger_config.py",
    "majlisna/settings.py",
    "scripts/*",
]

[tool.poe.tasks]
# Check commands (CI mode)
lint = "ruff check majlisna/ tests/"
format-check = "ruff format --check majlisna/ tests/"
# Type checking is part of `check` — and of the CI backend job — because a type checker
# that nobody runs is worse than none: .pre-commit-config.yaml claimed one for months
# while the hook was not installed and the package had 311 errors. Scope is majlisna/
# only, matching the hook.
#
# `--error-on-warning` is load-bearing: ty reports `deprecated`,
# `possibly-missing-submodule` and `unused-type-ignore-comment` as warnings, which do
# not fail the run by default. The second of those is what caught a broken `except`
# clause in the email service, so warnings gate here just like errors.
typecheck = "ty check majlisna/ --error-on-warning"
check = ["lint", "format-check", "typecheck"]

# Fix commands
lint-fix = "ruff check --fix majlisna/ tests/"
format = "ruff format majlisna/ tests/"
fix = ["format", "lint-fix"]

# Pre-commit
pre-commit = "prek run --all-files"

# Test commands
test = "pytest"
test-fast = "pytest -x"
test-verbose = "pytest -xvs"

[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
    "prek>=0.2.2",
    "ruff>=0.15.2",
    "types-python-jose>=3.5.0.20260408",
]

[tool.ty.environment]
# Pinned to the version CI and the production image run (Dockerfile: python:3.12-slim).
# Without this, ty analyses against whatever interpreter the local .venv holds — and a
# developer on 3.13 can get a clean run for code CI rejects. This is the same reason
# the mypy config it replaces pinned `python_version`.
python-version = "3.12"

[tool.ty.src]
# Scope matches the poe task, the pre-commit hook and the CI step: the shipped
# package only. Tests and the seeding script are deliberately outside it — they
# construct half-built models and monkeypatch freely, and the value of a type
# checker here is on the code that runs in production.
include = ["majlisna"]

[tool.ty.rules]
# Everything else stays at its default severity. In particular `deprecated`,
# `possibly-missing-submodule` and `unused-type-ignore-comment` are WARNINGS by
# default and the gate runs with `--error-on-warning`, so they fail the build like
# an error: `possibly-missing-submodule` is what found the `resend.exceptions.ApiError`
# handler that did not exist (see api/services/email.py), and a rule that found a
# production bug does not get to be advisory.
