server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in Server: / error pages.
    server_tokens off;

    # Docker's embedded DNS. The proxy locations below name the backend through a
    # variable, which makes nginx resolve it when a request needs it (cached for 10 s)
    # instead of once at start: a recreated backend gets a new address, and nginx used to
    # keep sending to the old one until the frontend restarted (PD-08). It also lets
    # nginx start while the backend is down; only the proxied paths answer 502 meanwhile.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Compression. The Dockerfile writes a gzip -9 twin (`<file>.gz`) next to every
    # compressible file of the build, and gzip_static serves it as is: no per-request
    # compression, and level 9 instead of 5. `gzip on` still compresses what has no twin.
    # No Brotli: the official nginx image has no ngx_brotli module.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers. NOTE: `add_header` is NOT inherited into a location that
    # declares its own add_header, so security-headers.conf must be included in
    # every location below — a server-level block alone would be dropped for
    # index.html and every static asset. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # ─── Caching ────────────────────────────────────────────────────────────────
    # Only Vite's output under /assets/ carries a content hash in its file name, so only
    # it may be cached for good. Every file from public/ keeps its name across releases
    # and must be able to change: favicon, icons, og-image, souhib.jpeg, the skies, the
    # service worker. They used to match an extension regex that made them immutable
    # for a year, Cloudflare included (FP-06).

    # Hashed build output: a year, immutable.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker: revalidated on every update check, or a fixed worker could
    # sit at the edge for a year.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The home skies (public/sky/) keep their names across releases (index.html preloads
    # them by name): a week, then revalidate. `^~` keeps the regex below off them.
    location ^~ /sky/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Every other static file from public/ (/favicon.*, /icons/, /og-image.*,
    # /souhib.jpeg, and whatever is added there later): a day, then revalidate.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA routing - serve index.html for all routes
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check endpoint. The include is not decoration: this block sets its own
    # add_header (Content-Type), which is exactly the condition that drops every
    # inherited header — the same trap documented in security-headers.conf.
    location /health {
        include /etc/nginx/security-headers.conf;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── Backend proxy ──────────────────────────────────────────────────────────
    # `majlisna-api` is an alias the backend carries on its project's own network, in
    # all three compose files. Not `backend`: on the shared dokploy-network three
    # projects' backends answer to that name. With no URI part in the variable, the
    # request URI is passed through unchanged, exactly as `proxy_pass http://host:port;`.
    # `^~` keeps the static-file regex above off proxied paths: without it a request such
    # as /api/v1/users/x.png would be looked up on disk and answer 404.

    # Proxy API requests to backend
    location ^~ /api/ {
        include /etc/nginx/security-headers.conf;
        set $majlisna_api http://majlisna-api:5000;
        proxy_pass $majlisna_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO to backend (WebSocket + long-polling)
    location ^~ /socket.io/ {
        include /etc/nginx/security-headers.conf;
        set $majlisna_api http://majlisna-api:5000;
        proxy_pass $majlisna_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
