# Security headers, kept in a separate file so they can be `include`d in EVERY
# location block.
#
# WHY a separate file: nginx `add_header` directives are inherited from the
# parent level ONLY IF the current level declares no `add_header` of its own.
# Both `location /` (which serves index.html) and the static-asset location set
# their own Cache-Control via add_header, which silently DISCARDED every
# server-level security header — the app shell was served with no
# X-Frame-Options, no nosniff and no HSTS at all. Including this file
# per-location is what makes them actually apply.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy — ENFORCED.
#
# It was Report-Only for one reason: the Umami and Sentry/GlitchTip hosts are baked
# into the bundle at build time from VITE_UMAMI_URL / VITE_SENTRY_DSN and were not
# knowable here, so an enforced policy would have silently blocked analytics and
# error reporting. The two `__TELEMETRY_*__` placeholders below are substituted from
# those very build args by the frontend Dockerfile's production stage — same values,
# same build, so the policy cannot drift from the bundle. Only the *origin* is taken
# from the DSN; its key is stripped and never reaches a response header.
#
# `connect-src` also gets the API's own origin, substituted from VITE_API_URL. This
# is not redundant with 'self': the docs support serving the backend from
# `api.majlisna.app` instead of `majlisna.app/api`, and 'self' is scheme+host+PORT, so
# a split origin — or the E2E stack's :5049 next to the frontend's :3049 — is a
# different origin that 'self' does not cover. Without it, an enforced policy blocks
# every single API call. The E2E suite is what surfaced this; it is exactly the silent
# production breakage that kept this header in report-only mode.
#
# An empty substitution is normal and valid: local dev and the E2E stack build
# without telemetry, which is also what lets the E2E suite prove the app itself works
# under enforcement (see e2e/tests/smoke/csp.spec.ts, which fails on any violation).
#
# The full external surface, enumerated from the source rather than assumed:
#   script-src  Google Identity Services (accounts.google.com/gsi/client) + Umami
#   style/font  Google Fonts
#   connect     same-origin API and Socket.IO (ws:/wss:), Google Identity,
#               open-meteo + geocoding + nominatim + ipapi (prayer times),
#               Umami /api/send and the Sentry envelope endpoint
#   frame       Google Identity's sign-in iframe
#   img         'https:' broadly, for Google profile pictures
# The footer's outbound links (github, linkedin, the two charities) need no entry:
# CSP does not restrict `<a href>` navigation.
#
# 'unsafe-inline' in script-src is still required by the inline Umami bootstrap and
# the service-worker registration in index.html. Replacing those with nonces is the
# next tightening, and the E2E check above is what makes attempting it safe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com __TELEMETRY_SCRIPT_SRC__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://accounts.google.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org https://ipapi.co __API_CONNECT_SRC__ __TELEMETRY_CONNECT_SRC__; frame-src 'self' https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
