# Security headers, kept in a separate file so they can be `include`d in EVERY
# location block.
#
# WHY a separate file: nginx `add_header` directives are inherited from the
# parent level ONLY IF the current level declares no `add_header` of its own.
# Both `location /` (which serves index.html) and the static-asset location set
# their own Cache-Control via add_header, which silently DISCARDED every
# server-level security header — the app shell was served with no
# X-Frame-Options, no nosniff and no HSTS at all. Including this file
# per-location is what makes them actually apply.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy in REPORT-ONLY mode.
#
# The allowlist below covers everything the SPA is known to load: Google Fonts,
# Google Identity Services (login), the prayer-times / geocoding APIs, and
# same-origin API + Socket.IO. It deliberately does NOT list the Umami and
# Sentry/GlitchTip hosts, because those are baked in at build time from
# VITE_UMAMI_URL / VITE_SENTRY_DSN and are not known here.
#
# Report-Only is intentional: an enforcing CSP that misses one host silently
# breaks analytics, error reporting or Google login in production. Watch the
# browser console for violations, add the missing hosts (Umami, Sentry), then
# switch this to `Content-Security-Policy` to enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://accounts.google.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org https://ipapi.co; frame-src 'self' https://accounts.google.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
